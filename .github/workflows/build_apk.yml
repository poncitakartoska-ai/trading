name: Build Kvant MOEX & Crypto PRO (Android APK + Windows PC EXE)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android-apk:
    name: Build Android APK (JDK 21 + Gradle 9.3.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept All Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
            "$SDKMANAGER" "platforms;android-36.1" || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env and debug.keystore for CI
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=AI_STUDIO_KEY" > .env
            fi
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Signed Installable APK (assembleDebug)
        run: |
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Kvant-MOEX-Crypto-PRO.apk

      - name: Upload Ready-to-Install Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kvant-MOEX-Crypto-PRO-Android-APK
          path: |
            app/build/outputs/apk/debug/Kvant-MOEX-Crypto-PRO.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-windows-exe:
    name: Build Windows PC (.exe)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller and build MOEX_Pulse_AI_Desktop.exe
        working-directory: desktop_pc_app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pyinstaller --noconfirm --onefile --windowed --name "MOEX_Pulse_AI_Desktop" moex_pulse_pc.py

      - name: Upload Standalone Windows PC (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: MOEX-Pulse-AI-Windows-Desktop-EXE
          path: desktop_pc_app/dist/MOEX_Pulse_AI_Desktop.exe
          if-no-files-found: warn
